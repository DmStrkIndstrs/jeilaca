<style>
    :root {
        --bg: #f0f4f8;
        --panel: rgba(255,255,255,0.97);
        --border: #cbd5e1;
        --accent: #0284c7;
        --text: #1e293b;
        --grid: rgba(14,116,144,0.05);
    }
    body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        background-image:

        background-size: 30px 30px;
        min-height: 100vh;
    }
    h1,h2,h3,h4,.font-hud { font-family: 'Rajdhani', sans-serif; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }

    .terran-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        backdrop-filter: blur(8px);
        position: relative;
    }
    .terran-panel::before {
        content:''; position:absolute; top:-1px; left:-1px; width:12px; height:12px;
        border-top:3px solid var(--accent); border-left:3px solid var(--accent);
    }
    .terran-panel::after {
        content:''; position:absolute; bottom:-1px; right:-1px; width:12px; height:12px;
        border-bottom:3px solid var(--accent); border-right:3px solid var(--accent);
    }

    .cursor-blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.35s ease-out both; }

    .custom-scrollbar::-webkit-scrollbar { height:8px; width:8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background:#e2e8f0; border-radius:4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background:#64748b; }

    .spinner {
        width: 40px; height: 40px;
        border: 4px solid rgba(2, 132, 199, 0.2);
        border-top-color: #0284c7;
        border-radius: 50%;

    /* Top-level tabs */
    .main-tab {

    /* Progress board (진도표) */
    .prog-search {
        width:100%; padding:10px 14px; border:2px solid #cbd5e1; border-radius:6px;
        font-family:'Noto Sans KR',sans-serif; font-size:14px; background:#f8fafc; color:#1e293b;

    details.prog-week { border:1px solid var(--border); border-radius:8px; background:var(--panel); overflow:hidden; }
    details.prog-week > summary {
        cursor:pointer; list-style:none; padding:14px 20px; background:#0f172a; color:#e2e8f0;
        font-family:'Share Tech Mono',monospace; font-weight:700; letter-spacing:0.08em; font-size:13px;

    details.prog-week[open] > summary::after { transform:rotate(180deg); }
    .prog-week-body { padding:18px; }

    .prog-grade-title {
        font-family:'Rajdhani',sans-serif; font-weight:800; font-size:20px; color:#0369a1;
        margin: 22px 0 10px; padding-bottom:6px; border-bottom:2px solid #bae6fd;

    .prog-grade-title:first-child { margin-top:0; }
    .prog-grade-title::after { content:'▾'; font-size:16px; color:#7dd3fc; transition:transform .2s; }
    .prog-grade-title.collapsed::after { transform:rotate(-90deg); }
    .prog-grade-title.collapsed { border-bottom-color:#e2e8f0; }

    details.prog-class-card {
        border:1px solid var(--border); border-radius:8px; background:#fff; margin-bottom:14px; overflow:hidden;

    details.prog-class-card > summary.prog-class-header {
        cursor:pointer; list-style:none;

        display:flex; align-items:center; justify-content:space-between;
    }
    details.prog-class-card > summary.prog-class-header::-webkit-details-marker { display:none; }

    details.prog-class-card:not([open]) > summary.prog-class-header { border-bottom:none; }
    details.prog-class-card:not([open]) > summary.prog-class-header::after { transform:rotate(-90deg); }
    .prog-subject {
        border-top:1px dashed #e2e8f0;
    }
    .prog-subject:first-child { border-top:none; }
    .prog-subject-header {

    table.prog-table { width:100%; border-collapse:collapse; table-layout:fixed; }
    table.prog-table th {

        padding:6px 10px; border:1px solid #e2e8f0; width:60px; text-align:center;

    table.prog-table td {
        border:1px solid #e2e8f0; padding:8px 10px; font-size:12.5px; line-height:1.5; vertical-align:top;
        white-space:pre-wrap; word-break:break-word; min-width:150px;

    table.prog-table td.row-label {
        background:#f8fafc; font-weight:700; font-family:'Share Tech Mono',monospace; font-size:11px;
        color:#64748b; text-align:center; width:56px; white-space:nowrap; vertical-align:middle;
    }
    table.prog-table td.row-eps { color:#7c3aed; }
    table.prog-table td.empty-cell { color:#cbd5e1; text-align:center; }

    .missing-teacher-title .missing-count {

    .missing-item {

    .missing-item.sev-none { border-left:4px solid #ef4444; }

    .missing-item .missing-title {

    }
    .missing-item .missing-title .teacher { color:#0284c7; }
    .missing-item .missing-detail { font-size:12px; color:#64748b; margin-top:4px; }
    .missing-empty-ok {
        text-align:center; padding:24px; color:#16a34a; font-family:'Share Tech Mono',monospace; font-weight:700; font-size:13px;
    }

    .teacher-banner {
        max-width: 72rem; margin: 20px auto 0; padding: 10px 18px; background:#fef9c3; border:1px solid #fde047;

        text-align:center;
    }

</style>

<script>
/* ───────────────────────── CSV helpers ───────────────────────── */
function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c === '"') {
                if (text[i + 1] === '"') { field += '"'; i++; }
                else inQuotes = false;
            } else field += c;
        } else {
            if (c === '"') inQuotes = true;
            else if (c === ',') { row.push(field); field = ''; }
            else if (c === '\r') { /* skip */ }
            else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
            else field += c;
        }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
}

async function fetchCSV(sheetId, gid) {
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&t=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return parseCSV(await res.text());
}

/* ───────────────────────── 진도표 (progress log) ───────────────────────── */
const PROGRESS_SHEETS = {
    'prog-mid':  { sheetId: '1lMg29yBF5H1npC0afxubHsfnjxdjA6jl_IBK39eLp6s', gid: '836088315', bodyId: 'prog-mid-body' },
    'prog-high': { sheetId: '1Mqldv3QQZ1c5CaR6n9onFKTE8iTbyuyHlgKEBAzsBqo', gid: '71261527',  bodyId: 'prog-high-body' }
};
const DAY_NAMES = ['월', '화', '수', '목', '금', '토', '일'];
const DAY_COL_START = 6; // column index of '월' in the sheet

function parseProgressRows(rows) {
    // weeks: ordered object { weekLabel: { grades: { gradeLabel: { classLabel: [subjectEntry, ...] } } } }
    const weeks = {};
    let curWeek = '', curGrade = '', curClass = '';
    let currentEntry = null;

    for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || r.every(c => !c || !c.trim())) continue;

        const rawWeek = (r[0] || '').trim();
        const rawGrade = (r[1] || '').trim();
        const rawClass = (r[2] || '').trim();
        const rawTeacher = (r[3] || '').trim();
        const rawSubject = (r[4] || '').trim();
        const rowType = (r[5] || '').trim();
        if (!rowType) continue;

        if (rawWeek) curWeek = rawWeek;
        if (rawGrade) curGrade = rawGrade;
        if (rawClass) curClass = rawClass;

        if (!curWeek || !curGrade || !curClass) continue;

        if (!weeks[curWeek]) weeks[curWeek] = {};
        if (!weeks[curWeek][curGrade]) weeks[curWeek][curGrade] = {};
        if (!weeks[curWeek][curGrade][curClass]) weeks[curWeek][curGrade][curClass] = [];
        const classArr = weeks[curWeek][curGrade][curClass];

        if (rawTeacher || rawSubject) {
            currentEntry = { teacher: rawTeacher, subject: rawSubject, data: {} };
            classArr.push(currentEntry);
        }
        if (!currentEntry) continue;

        if (!currentEntry.data[rowType]) currentEntry.data[rowType] = {};
        for (let d = 0; d < DAY_NAMES.length; d++) {
            const val = (r[DAY_COL_START + d] || '').trim();
            if (val) currentEntry.data[rowType][DAY_NAMES[d]] = val;
        }
    }
    return weeks;
}

function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

const ROW_TYPE_LABEL = { '진도': '진도', '과제': '과제', 'eps': 'EPS' };

function renderSubjectTable(entry) {
    const rowTypes = Object.keys(entry.data).filter(rt => rt in ROW_TYPE_LABEL || true);
    const orderedTypes = ['진도', '과제', 'eps'].filter(t => entry.data[t]);
    Object.keys(entry.data).forEach(t => { if (!orderedTypes.includes(t)) orderedTypes.push(t); });

    const usedDays = DAY_NAMES.filter(d => orderedTypes.some(t => entry.data[t][d]));
    if (!usedDays.length) return '';

    let html = `<table class="prog-table"><thead><tr><th></th>`;
    usedDays.forEach(d => { html += `<th>${d}</th>`; });
    html += `</tr></thead><tbody>`;
    orderedTypes.forEach(t => {
        html += `<tr><td class="row-label${t === 'eps' ? ' row-eps' : ''}">${ROW_TYPE_LABEL[t] || escapeHtml(t)}</td>`;
        usedDays.forEach(d => {
            const val = entry.data[t][d];
            html += val ? `<td>${escapeHtml(val)}</td>` : `<td class="empty-cell">-</td>`;
        });
        html += `</tr>`;
    });
    html += `</tbody></table>`;
    return html;
}

function renderProgressBoard(bodyEl, weeks) {
    bodyEl.innerHTML = '';
    const weekLabels = Object.keys(weeks);
    if (!weekLabels.length) {
        bodyEl.innerHTML = `<div class="terran-panel p-6 text-center text-slate-400 font-mono-tech text-sm">NO DATA</div>`;
        return;
    }

    weekLabels.forEach((week, wIdx) => {
        const details = document.createElement('details');
        details.className = 'prog-week fade-in';
        if (wIdx === weekLabels.length - 1) details.open = true; // latest week open by default

        const summary = document.createElement('summary');
        summary.innerHTML = `<span>📅 ${escapeHtml(week)} 주간 진도표</span><span></span>`;
        details.appendChild(summary);

        const body = document.createElement('div');
        body.className = 'prog-week-body';

        const grades = weeks[week];
        Object.keys(grades).forEach(grade => {
            const gradeGroup = document.createElement('div');
            gradeGroup.className = 'prog-grade-group';

            const gTitle = document.createElement('div');
            gTitle.className = 'prog-grade-title';
            gTitle.textContent = grade;
            gTitle.addEventListener('click', () => {
                gTitle.classList.toggle('collapsed');
                gradeGroup.querySelectorAll(':scope > details.prog-class-card').forEach(card => {
                    card.style.display = gTitle.classList.contains('collapsed') ? 'none' : '';
                });
            });
            gradeGroup.appendChild(gTitle);

            const classes = grades[grade];
            Object.keys(classes).forEach(className => {
                const entries = classes[className];
                const tablesHtml = entries.map(e => {
                    const tableHtml = renderSubjectTable(e);
                    if (!tableHtml) return '';
                    return `
                        <div class="prog-subject">
                            <div class="prog-subject-header">
                                <span class="teacher">${escapeHtml(e.teacher)}</span>
                                <span>${escapeHtml(e.subject)}</span>
                            </div>
                            ${tableHtml}
                        </div>`;
                }).filter(Boolean).join('');
                if (!tablesHtml) return;

                const card = document.createElement('details');
                card.className = 'prog-class-card';
                card.open = true;
                card.innerHTML = `
                    <summary class="prog-class-header">🏷 ${escapeHtml(className)}</summary>
                    ${tablesHtml}
                `;
                gradeGroup.appendChild(card);
            });

            body.appendChild(gradeGroup);
        });

        details.appendChild(body);
        bodyEl.appendChild(details);
    });
}

async function loadProgressTab(tabKey) {
    const cfg = PROGRESS_SHEETS[tabKey];
    const bodyEl = document.getElementById(cfg.bodyId);
    bodyEl.innerHTML = `
        <div class="flex flex-col items-center justify-center py-20 text-slate-500 font-mono-tech">
            <div class="spinner mb-4"></div>
            <p class="tracking-widest animate-pulse font-bold text-sm">SYNCING WITH GOOGLE SHEETS...</p>
        </div>`;
    try {
        const rows = await fetchCSV(cfg.sheetId, cfg.gid);
        const weeks = parseProgressRows(rows);
        renderProgressBoard(bodyEl, weeks);
        applyTeacherFilter(tabKey);
    } catch (err) {
        bodyEl.innerHTML = `<div class="terran-panel p-6 text-red-600 font-mono-tech text-xs font-bold">⚠ 데이터를 불러오지 못했습니다: ${err}</div>`;
    }
}

/* ───────────────────────── TAB 3: 미기록 현황 (missing records) ─────────────────────────
   대부분 반은 월수금 또는 화목토 고정 요일로 수업하므로, 이 시트에 쌓인 지난 주차들의
   실제 기록 요일을 모아 "평소 수업 요일"을 스스로 추정하고, 최신 주차에서 그 요일이
   통째로 비어있으면 (수업은 있었는데 기록을 안 한 것으로 보고) 잡아낸다. */
function parseWeekEndDate(label) {
    const m = label.match(/(\d+)\s*\/\s*(\d+)\s*[~\-]\s*(\d+)\s*\/\s*(\d+)/);
    if (!m) return null;
    const startMonth = parseInt(m[1], 10);
    const endMonth = parseInt(m[3], 10), endDay = parseInt(m[4], 10);
    let year = new Date().getFullYear();
    if (endMonth < startMonth) year += 1; // week crosses a year boundary (e.g. 12/29~1/4)
    const d = new Date(year, endMonth - 1, endDay, 23, 59, 59);
    return isNaN(d.getTime()) ? null : d;
}

function computeMissing(weeks) {
    const now = new Date();
    // 아직 끝나지 않은(미래) 주차는 "기록 안 됨"이 아니라 그냥 "아직 진행 전"이므로 제외
    const weekLabels = Object.keys(weeks).filter(w => {
        const end = parseWeekEndDate(w);
        return !end || end <= now;
    });
    if (!weekLabels.length) return { latestWeek: null, results: [] };
    const latestWeek = weekLabels[weekLabels.length - 1];

    const expectedDays = {}; // "grade|class|teacher|subject" -> Set(요일)
    weekLabels.forEach(week => {
        const grades = weeks[week];
        Object.keys(grades).forEach(grade => {
            Object.keys(grades[grade]).forEach(className => {
                grades[grade][className].forEach(entry => {
                    const key = `${grade}|${className}|${entry.teacher}|${entry.subject}`;
                    const rowTypes = Object.keys(entry.data);
                    DAY_NAMES.forEach(d => {
                        if (rowTypes.some(t => entry.data[t][d])) {
                            (expectedDays[key] || (expectedDays[key] = new Set())).add(d);
                        }
                    });
                });
            });
        });
    });

    const results = [];
    const grades = weeks[latestWeek];
    Object.keys(grades).forEach(grade => {
        Object.keys(grades[grade]).forEach(className => {
            grades[grade][className].forEach(entry => {
                const key = `${grade}|${className}|${entry.teacher}|${entry.subject}`;
                const rowTypes = Object.keys(entry.data);
                if (!rowTypes.length) return;
                const usedDays = DAY_NAMES.filter(d => rowTypes.some(t => entry.data[t][d]));
                const expected = expectedDays[key] || new Set();

                if (!usedDays.length) {
                    const hint = expected.size ? ` (평소 수업일: ${[...expected].join(', ')})` : '';
                    results.push({ grade, className, teacher: entry.teacher, subject: entry.subject, severity: 'none',
                        detail: `이번 주 기록이 전혀 없습니다.${hint}` });
                    return;
                }

                const gaps = [];
                expected.forEach(d => {
                    if (!usedDays.includes(d)) gaps.push(`${d}요일 전체 누락 (평소 수업일)`);
                });
                usedDays.forEach(d => {
                    rowTypes.forEach(t => {
                        if (!entry.data[t][d]) gaps.push(`${d}요일 ${ROW_TYPE_LABEL[t] || t} 누락`);
                    });
                });

                if (gaps.length) {
                    results.push({ grade, className, teacher: entry.teacher, subject: entry.subject, severity: 'partial', detail: gaps.join(', ') });
                }
            });
        });
    });

    return { latestWeek, results };
}

function renderMissingList(bodyEl, weeks) {
    const { latestWeek, results } = computeMissing(weeks);
    if (!latestWeek) {
        bodyEl.innerHTML = `<div class="missing-empty-ok">아직 시작되지 않은 주차뿐입니다 (데이터 없음)</div>`;
        return;
    }
    if (!results.length) {
        bodyEl.innerHTML = `<div class="missing-empty-ok">✅ ${escapeHtml(latestWeek)} 주 — 모든 기록이 완료되었습니다!</div>`;
        return;
    }
    const byTeacher = {};
    results.forEach(r => {
        const key = r.teacher || '(미상)';
        (byTeacher[key] || (byTeacher[key] = [])).push(r);
    });
    const teachers = Object.keys(byTeacher).sort((a, b) => byTeacher[b].length - byTeacher[a].length);

    bodyEl.innerHTML = `<p class="font-mono-tech text-xs text-slate-400 mb-3">${escapeHtml(latestWeek)} 주 기준</p>` +
        teachers.map(teacher => {
            const items = byTeacher[teacher];
            return `
                <div class="missing-teacher-group">
                    <h3 class="missing-teacher-title"><span class="teacher">${escapeHtml(teacher)}</span> 선생님 <span class="missing-count">${items.length}건</span></h3>
                    ${items.map(r => `
                        <div class="missing-item sev-${r.severity}">
                            <div class="missing-title">
                                ${r.severity === 'none' ? '🔴' : '🟡'} ${escapeHtml(r.grade)} · ${escapeHtml(r.className)} · ${escapeHtml(r.subject)}
                            </div>
                            <div class="missing-detail">${escapeHtml(r.detail)}</div>
                        </div>
                    `).join('')}
                </div>`;
        }).join('');
}

async function loadMissingTab() {
    const midBody = document.getElementById('missing-mid-body');
    const highBody = document.getElementById('missing-high-body');
    midBody.innerHTML = highBody.innerHTML = `<div class="flex justify-center py-10"><div class="spinner"></div></div>`;

    const [midRows, highRows] = await Promise.allSettled([
        fetchCSV(PROGRESS_SHEETS['prog-mid'].sheetId, PROGRESS_SHEETS['prog-mid'].gid),
        fetchCSV(PROGRESS_SHEETS['prog-high'].sheetId, PROGRESS_SHEETS['prog-high'].gid)
    ]);

    if (midRows.status === 'fulfilled') renderMissingList(midBody, parseProgressRows(midRows.value));
    else midBody.innerHTML = `<div class="text-red-600 font-mono-tech text-xs">⚠ 로드 실패: ${midRows.reason}</div>`;

    if (highRows.status === 'fulfilled') renderMissingList(highBody, parseProgressRows(highRows.value));
    else highBody.innerHTML = `<div class="text-red-600 font-mono-tech text-xs">⚠ 로드 실패: ${highRows.reason}</div>`;
}

/* ───────────────────────── Search filter (진도표 tabs) ───────────────────────── */
function filterProgressBoard(input) {
    const target = document.getElementById(input.dataset.target);
    const q = input.value.trim().toLowerCase();
    target.querySelectorAll('.prog-class-card').forEach(card => {
        const match = !q || card.textContent.toLowerCase().includes(q);
        card.classList.toggle('filtered-out', !match);
    });
    target.querySelectorAll('.prog-grade-group').forEach(group => {
        const anyVisible = !!group.querySelector('.prog-class-card:not(.filtered-out)');
        group.style.display = (q && !anyVisible) ? 'none' : '';
    });
    target.querySelectorAll('.prog-week').forEach(week => {
        const anyVisible = !!week.querySelector('.prog-class-card:not(.filtered-out)');
        week.style.display = (q && !anyVisible) ? 'none' : '';
        if (q && anyVisible) week.open = true;
    });
}

document.querySelectorAll('.prog-search').forEach(input => {
    input.addEventListener('input', () => filterProgressBoard(input));
});

/* ───────────────────────── Per-teacher bookmark link (?t=코드) ───────────────────────── */
const TEACHER_CODE = (new URLSearchParams(location.search).get('t') || '').trim();

function applyTeacherFilter(tabKey) {
    if (!TEACHER_CODE) return;
    const cfg = PROGRESS_SHEETS[tabKey];
    if (!cfg) return;
    const input = document.querySelector(`.prog-search[data-target="${cfg.bodyId}"]`);
    if (!input) return;
    input.value = TEACHER_CODE;
    filterProgressBoard(input);
}

function setupTeacherBanner() {
    if (!TEACHER_CODE) return;
    const banner = document.getElementById('teacherBanner');
    banner.hidden = false;
    banner.innerHTML = `🔖 <strong>${escapeHtml(TEACHER_CODE)}</strong> 선생님 전용 보기 · <a href="${location.pathname}">전체보기</a>`;
}

/* ───────────────────────── Tab switching ───────────────────────── */
const TAB_LOADERS = {
    'prog-mid': () => loadProgressTab('prog-mid'),
    'prog-high': () => loadProgressTab('prog-high'),
    'missing': loadMissingTab
};
const loadedTabs = new Set();

function activateTab(key) {
    document.querySelectorAll('.main-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
    document.querySelectorAll('.tab-panel').forEach(p => p.hidden = (p.id !== 'tab-' + key));
}

document.querySelectorAll('.main-tab').forEach(btn => {
    btn.addEventListener('click', () => {
        const key = btn.dataset.tab;
        activateTab(key);
        if (!loadedTabs.has(key)) {
            loadedTabs.add(key);
            TAB_LOADERS[key]();
        }
    });
});

async function loadAll() {
    if (TEACHER_CODE) {
        loadedTabs.clear();
        loadedTabs.add('prog-mid'); loadedTabs.add('prog-high');
        await Promise.all([loadProgressTab('prog-mid'), loadProgressTab('prog-high')]);
        const midHasMatch = document.querySelector('#prog-mid-body .prog-class-card:not(.filtered-out)');
        const highHasMatch = document.querySelector('#prog-high-body .prog-class-card:not(.filtered-out)');
        activateTab((!midHasMatch && highHasMatch) ? 'prog-high' : 'prog-mid');
    } else {
        loadedTabs.clear();
        const activeKey = document.querySelector('.main-tab.active').dataset.tab;
        loadedTabs.add(activeKey);
        await TAB_LOADERS[activeKey]();
    }
    document.getElementById('lastSync').textContent =
        '> last sync: ' + new Date().toLocaleTimeString('ko-KR');
}

document.getElementById('refreshBtn').addEventListener('click', loadAll);
setupTeacherBanner();
loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
